version: "3.9"

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks:
    - app-network

services:
  # ── Database ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    <<: *app-defaults
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-recup_indurex}
      POSTGRES_USER: ${DB_USER:-recup_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recup_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recup_user} -d ${DB_NAME:-recup_indurex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ports:
    #   - "5432:5432"  # Commenté en production — accessible uniquement via le réseau Docker interne
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Django Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *app-defaults
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
      - backend_logs:/app/logs
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,nginx,${DOMAIN}
      DJANGO_CORS_ALLOWED_ORIGINS: https://${DOMAIN:-your-domain.com}
      DJANGO_SECURE_SSL_REDIRECT: "False"  # Nginx handles SSL, not Django
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; conn=http.client.HTTPConnection('localhost',8000); conn.request('GET','/'); resp=conn.getresponse(); resp.read(); assert resp.status < 500"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Nginx (Reverse Proxy + Frontend) ─────────────────────
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    <<: *app-defaults
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static:/static:ro
      - backend_media:/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ── DB Backup automatique (toutes les 24h) ─────────────
  db-backup:
    image: postgres:16-alpine
    <<: *app-defaults
    profiles:
      - backup     # Démarrage manuel : docker compose --profile backup up -d
    volumes:
      - db_backups:/backups
    env_file:
      - .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${DB_NAME:-recup_indurex}
      PGUSER: ${DB_USER:-recup_user}
      PGPASSWORD: ${DB_PASSWORD:-recup_password}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    entrypoint: >
      /bin/sh -c '
        echo "⏰ Service de backup démarré (intervalle: 24h, rétention: ${BACKUP_RETENTION_DAYS:-30} jours)";
        while true; do
          TS=$(date +%Y%m%d_%H%M%S);
          echo "[$$TS] 💾 Backup en cours...";
          pg_dump --no-owner --no-acl --clean --if-exists \
            | gzip > "/backups/recup_indurex_$$TS.sql.gz" \
            && {
              SIZE=$$(du -h "/backups/recup_indurex_$$TS.sql.gz" | cut -f1);
              echo "[$$TS] ✅ Sauvegarde: recup_indurex_$$TS.sql.gz ($$SIZE)";
              find /backups -maxdepth 1 -name "recup_indurex_*.sql.gz" \
                -mtime +$${BACKUP_RETENTION_DAYS:-30} -delete 2>/dev/null || true;
            } \
            || echo "[$$TS] ❌ Échec backup";
          sleep 86400;
        done
      '
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Certbot (Let's Encrypt) — auto-renewal loop ──────────
  certbot:
    image: certbot/certbot:latest
    <<: *app-defaults
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c '
        trap exit TERM;
        while true; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done;
      '
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Admin: Run migrations + full setup on startup ────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *app-defaults
    entrypoint: ["sh", "-c"]
    command: >
      "python manage.py migrate --noinput &&
       python manage.py createsuperuser --noinput 2>/dev/null || true &&
       python manage.py setup_rbac 2>/dev/null || true"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - setup

volumes:
  postgres_data:
    driver: local
  backend_media:
    driver: local
  backend_static:
    driver: local
  backend_logs:
    driver: local
  db_backups:
    driver: local

networks:
  app-network:
    driver: bridge
